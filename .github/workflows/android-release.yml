name: android-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-owner-preview-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: android-v0.1.0-alpha.2
      APK_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.2.apk
      CHECKSUM_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.2.apk.sha256
      SIZE_REPORT_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.2.apk-size.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build installable Android owner-preview APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Audit owner-preview APK size composition
        run: python3 tests/android-apk-size-audit.py android/app/build/outputs/apk/debug/app-debug.apk --json-out android/app/build/reports/apk-size.json

      - name: Certify Android contracts
        run: |
          python3 tests/cross-device-reconciliation-smoke.py
          python3 tests/android-dna-reconciliation-import-smoke.py
          python3 tests/android-conversation-reconciliation-smoke.py
          python3 tests/android-live-normalization-smoke.py
          python3 tests/android-exports-backups-smoke.py
          python3 tests/android-foundation-smoke.py
          python3 tests/android-geckoview-runtime-smoke.py
          python3 tests/android-native-ingress-smoke.py
          python3 tests/android-apk-size-audit.py --self-test

      - name: Stage APK checksum and size report
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          cp android/app/build/reports/apk-size.json "release/${SIZE_REPORT_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${CHECKSUM_NAME}"
          )

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bke-dna-logger-android-0.1.0-alpha.2
          path: |
            release/${{ env.APK_NAME }}
            release/${{ env.CHECKSUM_NAME }}
            release/${{ env.SIZE_REPORT_NAME }}
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; leaving the immutable preview release unchanged."
            exit 0
          fi

          cat > release/RELEASE_NOTES.md <<'EOF'
          # BKE DNA Logger Android 0.1.0-alpha.2

          Owner/internal Android performance and storage preview.

          ## Current architecture

          - ChatGPT's GeckoSession stays alive while Working Data & Conversations is open; Back returns to the existing browser session.
          - Captured response clones stream from `ReadableStream` in bounded 128 KiB pieces with backpressure into Android.
          - Exact RAW is staged crash-safely, then stored as independently compressed and byte-for-byte verified chunks inside Working Data SQLite.
          - Classification and normalized derivatives for new sources are stored inside Working Data SQLite instead of permanent loose derivative files.
          - Classification/normalization/reconciliation run on a background single-thread breathing queue after RAW evidence and capture metadata are durable.
          - CLEAN is paged from SQLite logical rows; RAW is read through a bounded SQLite-first source pager.
          - Working Data backup contains the actual self-contained SQLite generation and is re-opened/checksum-verified after writing.
          - Working Data backup restore creates a separate verified read-only generation; foreign SQLite is never merged or attached into Latest.
          - Saved Working Data generations can be deleted directly with exact `jan2x` confirmation. `.dna` is a portable conversation export, not the Working Data deletion gate.
          - Gecko file prompts support document/gallery selection, multiple files, folders and user-controlled camera image/video capture without automatically duplicating selected local files into DNA evidence.
          - APK composition is measured during CI/release so GeckoView/native-library cost and app-owned DEX/assets/resources remain visible.

          ## Current semantic-processing boundary

          Large-response transport is streamed and capture processing is backgrounded. Deep JSON classifier/normalizer work still keeps its conservative 16 MiB semantic parsing limit in this alpha; larger payloads remain preserved as immutable exact RAW rather than risking an unbounded JSON object graph.

          ## Device target

          - Android API 26+.
          - arm64-v8a only.

          ## Signing status

          This owner/internal alpha uses Android debug signing for immediate physical-device testing. It is not the long-term production signing identity.

          ## Evidence safety

          The logger does not capture Authorization values, cookies, request-header collections, or response-header collections. SQLite Working Data is the local durability authority; portable `.dna` export remains explicit and owner-controlled.
          EOF

          gh release create "${RELEASE_TAG}" \
            "release/${APK_NAME}" \
            "release/${CHECKSUM_NAME}" \
            "release/${SIZE_REPORT_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "BKE DNA Logger Android 0.1.0-alpha.2" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
