name: android-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-owner-preview-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: android-v0.1.0-alpha.2
      APK_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.2.apk
      CHECKSUM_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.2.apk.sha256
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build installable Android owner-preview APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Certify Android contracts
        run: |
          python3 tests/cross-device-reconciliation-smoke.py
          python3 tests/android-dna-reconciliation-import-smoke.py
          python3 tests/android-conversation-reconciliation-smoke.py
          python3 tests/android-live-normalization-smoke.py
          python3 tests/android-exports-backups-smoke.py
          python3 tests/android-foundation-smoke.py
          python3 tests/android-geckoview-runtime-smoke.py
          python3 tests/android-native-ingress-smoke.py

      - name: Stage APK and checksum
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${CHECKSUM_NAME}"
          )

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bke-dna-logger-android-0.1.0-alpha.2
          path: |
            release/${{ env.APK_NAME }}
            release/${{ env.CHECKSUM_NAME }}
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; leaving the immutable preview release unchanged."
            exit 0
          fi

          cat > release/RELEASE_NOTES.md <<'EOF'
          # BKE DNA Logger Android 0.1.0-alpha.2

          Owner/internal Android performance and storage preview.

          ## What changed since alpha.1

          - ChatGPT's GeckoSession stays alive while Working Data & Conversations is open; Back returns to the existing browser session instead of explicitly loading ChatGPT again.
          - Captured response clones stream from `ReadableStream` in bounded 128 KiB pieces instead of first materializing the entire response with `arrayBuffer()`.
          - Every streamed chunk waits for the Android native-message path before the next chunk is read, providing bounded backpressure.
          - Raw evidence still streams to app-private partial files with incremental SHA-256, fsync, content-addressed promotion and deduplication.
          - Classification/normalization/reconciliation run on a background single-thread derivative lane after raw evidence + observation + capture index are durable, so capture-end acknowledgement no longer waits for semantic processing.
          - Working Data rotation/import/archive mutations pause only the capture writer and drain queued derivatives; they do not intentionally destroy the Gecko browser session.
          - Adds red `PURGE VERIFIED RAW` and `PURGE ALL VERIFIED RAW` actions guarded by the exact confirmation `jan2x`.
          - Purge is fail-closed: a conversation and every source must already be covered by the same verified `.dna`, and source evidence referenced by another Working Data conversation is retained.
          - Purge removes only local heavy SHA-addressed raw/normalized/classification/observation files. SQLite and logical conversation state remain resident so the library/CLEAN reader does not disappear.

          ## Current semantic-processing boundary

          Large-response transport is now streamed and capture processing is backgrounded. The existing deep JSON classifier/normalizer still keeps its conservative 16 MiB semantic parsing limit in this alpha; payloads above that limit remain preserved as immutable RAW evidence rather than risking an unbounded JSON object graph. Streaming semantic normalization is a separate follow-up gate.

          ## Device target

          - Android API 26+.
          - arm64-v8a.

          ## Signing status

          This owner/internal alpha uses Android debug signing for immediate physical-device testing. It is not the long-term production signing identity.

          ## Evidence safety

          The logger does not capture Authorization values, cookies, request-header collections, or response-header collections. Verified conversation `.dna` remains the only durability authority for destructive local evidence cleanup.
          EOF

          gh release create "${RELEASE_TAG}" \
            "release/${APK_NAME}" \
            "release/${CHECKSUM_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "BKE DNA Logger Android 0.1.0-alpha.2" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
