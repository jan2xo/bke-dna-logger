name: android-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: android-v0.1.0-alpha.5
      APK_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.5.apk
      CHECKSUM_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.5.apk.sha256
      SIZE_REPORT_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.5.apk-size.json
      SIGNING_REPORT_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.5.signing.txt
      RELEASE_APK: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare production Android signing identity
        env:
          BKE_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.BKE_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          BKE_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_STORE_PASSWORD }}
          BKE_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.BKE_ANDROID_RELEASE_KEY_ALIAS }}
          BKE_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "${BKE_ANDROID_RELEASE_KEYSTORE_BASE64}" || { echo "Missing BKE_ANDROID_RELEASE_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "${BKE_ANDROID_RELEASE_STORE_PASSWORD}" || { echo "Missing BKE_ANDROID_RELEASE_STORE_PASSWORD" >&2; exit 1; }
          test -n "${BKE_ANDROID_RELEASE_KEY_ALIAS}" || { echo "Missing BKE_ANDROID_RELEASE_KEY_ALIAS" >&2; exit 1; }
          test -n "${BKE_ANDROID_RELEASE_KEY_PASSWORD}" || { echo "Missing BKE_ANDROID_RELEASE_KEY_PASSWORD" >&2; exit 1; }

          KEYSTORE_PATH="${RUNNER_TEMP}/bke-dna-release.jks"
          printf '%s' "${BKE_ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -storepass "${BKE_ANDROID_RELEASE_STORE_PASSWORD}" \
            -alias "${BKE_ANDROID_RELEASE_KEY_ALIAS}" >/dev/null
          echo "BKE_ANDROID_RELEASE_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Build production-signed Android release APK
        env:
          BKE_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_STORE_PASSWORD }}
          BKE_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.BKE_ANDROID_RELEASE_KEY_ALIAS }}
          BKE_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Verify production APK signature
        run: |
          test -f "${RELEASE_APK}"
          mkdir -p android/app/build/reports
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "${RELEASE_APK}" | tee android/app/build/reports/release-signing.txt
          if grep -Fq 'CN=Android Debug' android/app/build/reports/release-signing.txt; then
            echo "Refusing to publish an APK signed with the Android debug certificate." >&2
            exit 1
          fi

      - name: Audit production APK size composition
        run: python3 tests/android-apk-size-audit.py "${RELEASE_APK}" --json-out android/app/build/reports/apk-size.json

      - name: Certify Android contracts
        run: |
          python3 tests/cross-device-reconciliation-smoke.py
          python3 tests/android-dna-reconciliation-import-smoke.py
          python3 tests/android-conversation-reconciliation-smoke.py
          python3 tests/android-live-normalization-smoke.py
          python3 tests/android-modern-conversation-coverage-smoke.py
          python3 tests/android-sqlite-normalization-recovery-smoke.py
          python3 tests/android-exports-backups-smoke.py
          python3 tests/android-foundation-smoke.py
          python3 tests/android-geckoview-runtime-smoke.py
          python3 tests/android-native-ingress-smoke.py
          python3 tests/android-apk-size-audit.py --self-test
          python3 tests/android-release-signing-smoke.py

      - name: Stage release APK, checksum, size and signing reports
        run: |
          mkdir -p release
          cp "${RELEASE_APK}" "release/${APK_NAME}"
          cp android/app/build/reports/apk-size.json "release/${SIZE_REPORT_NAME}"
          cp android/app/build/reports/release-signing.txt "release/${SIGNING_REPORT_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${CHECKSUM_NAME}"
          )

      - name: Preserve production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bke-dna-logger-android-0.1.0-alpha.5
          path: |
            release/${{ env.APK_NAME }}
            release/${{ env.CHECKSUM_NAME }}
            release/${{ env.SIZE_REPORT_NAME }}
            release/${{ env.SIGNING_REPORT_NAME }}
          if-no-files-found: error

      - name: Publish immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; leaving the immutable release unchanged."
            exit 0
          fi

          cat > release/RELEASE_NOTES.md <<'EOF'
          # BKE DNA Logger Android 0.1.0-alpha.5

          Production-signed conversation representation coverage hotfix for the SQLite-first Android DNA pipeline.

          ## Fixed

          - Restores normalization for legitimate modern ChatGPT message payloads that are classified as conversation candidates but omit a root `conversation_id`.
          - Conversation identity may be recovered only from exact request/page metadata persisted for the same RAW source SHA; conflicting metadata fails closed.
          - Supports one unambiguous nested `messages` envelope and object-backed message collections without inventing graph edges.
          - Adds an explicit `text/event-stream` conversation normalizer for new-chat/incremental responses. Later stream observations of the same message id replace earlier incremental versions.
          - Re-arms alpha.4 DONE conversation candidates that still have no normalized derivative so already verified SQLite RAW can be retried without recapture.

          ## Unchanged guardrails

          - Classifier admission remains `score >= 28`; high confidence remains `score >= 55`.
          - Deep semantic parsing remains capped at 16 MiB. Larger bodies remain preserved as exact RAW.
          - No fabricated parent/child graph edges, no fabricated conversation ids, no RAW deletion, and no foreign SQLite merge.

          ## Release identity

          - Built with the Android `release` build type (`assembleRelease`).
          - Signed with the repository production Android signing identity supplied through GitHub Actions secrets.
          - The workflow verifies the APK signature with `apksigner` and refuses the standard Android debug certificate.
          - arm64-v8a only.
          EOF

          gh release create "${RELEASE_TAG}" \
            "release/${APK_NAME}" \
            "release/${CHECKSUM_NAME}" \
            "release/${SIZE_REPORT_NAME}" \
            "release/${SIGNING_REPORT_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "BKE DNA Logger Android 0.1.0-alpha.5" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
