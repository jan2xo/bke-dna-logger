name: android-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: android-v0.1.0-alpha.3
      APK_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.3.apk
      CHECKSUM_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.3.apk.sha256
      SIZE_REPORT_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.3.apk-size.json
      SIGNING_REPORT_NAME: BKE-DNA-Logger-Android-0.1.0-alpha.3.signing.txt
      RELEASE_APK: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare production Android signing identity
        env:
          BKE_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.BKE_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          BKE_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_STORE_PASSWORD }}
          BKE_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.BKE_ANDROID_RELEASE_KEY_ALIAS }}
          BKE_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "${BKE_ANDROID_RELEASE_KEYSTORE_BASE64}" || { echo "Missing BKE_ANDROID_RELEASE_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "${BKE_ANDROID_RELEASE_STORE_PASSWORD}" || { echo "Missing BKE_ANDROID_RELEASE_STORE_PASSWORD" >&2; exit 1; }
          test -n "${BKE_ANDROID_RELEASE_KEY_ALIAS}" || { echo "Missing BKE_ANDROID_RELEASE_KEY_ALIAS" >&2; exit 1; }
          test -n "${BKE_ANDROID_RELEASE_KEY_PASSWORD}" || { echo "Missing BKE_ANDROID_RELEASE_KEY_PASSWORD" >&2; exit 1; }

          KEYSTORE_PATH="${RUNNER_TEMP}/bke-dna-release.jks"
          printf '%s' "${BKE_ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -storepass "${BKE_ANDROID_RELEASE_STORE_PASSWORD}" \
            -alias "${BKE_ANDROID_RELEASE_KEY_ALIAS}" >/dev/null
          echo "BKE_ANDROID_RELEASE_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Build production-signed Android release APK
        env:
          BKE_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_STORE_PASSWORD }}
          BKE_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.BKE_ANDROID_RELEASE_KEY_ALIAS }}
          BKE_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.BKE_ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Verify production APK signature
        run: |
          test -f "${RELEASE_APK}"
          mkdir -p android/app/build/reports
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "${RELEASE_APK}" | tee android/app/build/reports/release-signing.txt
          if grep -Fq 'CN=Android Debug,O=Android,C=US' android/app/build/reports/release-signing.txt; then
            echo "Refusing to publish an APK signed with the Android debug certificate." >&2
            exit 1
          fi

      - name: Audit production APK size composition
        run: python3 tests/android-apk-size-audit.py "${RELEASE_APK}" --json-out android/app/build/reports/apk-size.json

      - name: Certify Android contracts
        run: |
          python3 tests/cross-device-reconciliation-smoke.py
          python3 tests/android-dna-reconciliation-import-smoke.py
          python3 tests/android-conversation-reconciliation-smoke.py
          python3 tests/android-live-normalization-smoke.py
          python3 tests/android-exports-backups-smoke.py
          python3 tests/android-foundation-smoke.py
          python3 tests/android-geckoview-runtime-smoke.py
          python3 tests/android-native-ingress-smoke.py
          python3 tests/android-apk-size-audit.py --self-test
          python3 tests/android-release-signing-smoke.py

      - name: Stage release APK, checksum, size and signing reports
        run: |
          mkdir -p release
          cp "${RELEASE_APK}" "release/${APK_NAME}"
          cp android/app/build/reports/apk-size.json "release/${SIZE_REPORT_NAME}"
          cp android/app/build/reports/release-signing.txt "release/${SIGNING_REPORT_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${CHECKSUM_NAME}"
          )

      - name: Preserve production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bke-dna-logger-android-0.1.0-alpha.3
          path: |
            release/${{ env.APK_NAME }}
            release/${{ env.CHECKSUM_NAME }}
            release/${{ env.SIZE_REPORT_NAME }}
            release/${{ env.SIGNING_REPORT_NAME }}
          if-no-files-found: error

      - name: Publish immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; leaving the immutable release unchanged."
            exit 0
          fi

          cat > release/RELEASE_NOTES.md <<'EOF'
          # BKE DNA Logger Android 0.1.0-alpha.3

          Production-signed owner/internal Android release candidate containing the completed nine-PR SQLite/GeckoView architecture program.

          ## Release identity

          - Built with the Android `release` build type (`assembleRelease`).
          - Signed with the repository production Android signing identity supplied through GitHub Actions secrets.
          - The workflow verifies the APK signature with `apksigner` and refuses the standard Android debug certificate.
          - arm64-v8a only.

          ## Current architecture

          - ChatGPT's GeckoSession stays alive while Working Data & Conversations is open; Back returns to the existing browser session.
          - Captured response clones stream from `ReadableStream` in bounded 128 KiB pieces with backpressure into Android.
          - Exact RAW is staged crash-safely, then stored as independently compressed and byte-for-byte verified chunks inside Working Data SQLite.
          - Classification and normalized derivatives for new sources are stored inside Working Data SQLite instead of permanent loose derivative files.
          - Classification/normalization/reconciliation run on a background single-thread breathing queue after RAW evidence and capture metadata are durable.
          - CLEAN is paged from SQLite logical rows; RAW is read through a bounded SQLite-first source pager.
          - Working Data backup contains the actual self-contained SQLite generation and is re-opened/checksum-verified after writing.
          - Working Data backup restore creates a separate verified read-only generation; foreign SQLite is never merged or attached into Latest.
          - Saved Working Data generations can be deleted directly with exact `jan2x` confirmation. `.dna` is a portable conversation export, not the Working Data deletion gate.
          - Gecko file prompts support document/gallery selection, multiple files, folders and user-controlled camera image/video capture without automatically duplicating selected local files into DNA evidence.
          - APK composition is measured during CI/release so GeckoView/native-library cost and app-owned DEX/assets/resources remain visible.

          ## Semantic-processing boundary

          Deep JSON classifier/normalizer work still keeps its conservative 16 MiB semantic parsing limit. Larger payloads remain preserved as immutable exact RAW rather than risking an unbounded JSON object graph.

          ## Evidence safety

          The logger does not capture Authorization values, cookies, request-header collections, or response-header collections. SQLite Working Data is the local durability authority; portable `.dna` export remains explicit and owner-controlled.
          EOF

          gh release create "${RELEASE_TAG}" \
            "release/${APK_NAME}" \
            "release/${CHECKSUM_NAME}" \
            "release/${SIZE_REPORT_NAME}" \
            "release/${SIGNING_REPORT_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "BKE DNA Logger Android 0.1.0-alpha.3" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
