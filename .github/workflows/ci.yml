name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native host
        run: dotnet build src/BKE.Dna.Logger.Host/BKE.Dna.Logger.Host.csproj --configuration Release
      - name: Smoke version
        run: dotnet run --project src/BKE.Dna.Logger.Host/BKE.Dna.Logger.Host.csproj --configuration Release --no-build -- --version
      - name: Native Messaging evidence-store smoke
        run: python3 tests/native-host-smoke.py src/BKE.Dna.Logger.Host/bin/Release/net10.0/BKE.Dna.Logger.Host.dll
      - name: SQLite schema and durability-gate smoke
        run: python3 tests/sqlite-schema-smoke.py src/BKE.Dna.Logger.Host/bin/Release/net10.0/BKE.Dna.Logger.Host.dll
      - name: SQLite live projection and replay smoke
        run: python3 tests/sqlite-projection-smoke.py src/BKE.Dna.Logger.Host/bin/Release/net10.0/BKE.Dna.Logger.Host.dll
      - name: DNA archive build verify corruption and durability smoke
        run: python3 tests/dna-archive-smoke.py src/BKE.Dna.Logger.Host/bin/Release/net10.0/BKE.Dna.Logger.Host.dll
      - name: Multi-snapshot conversation aggregation smoke
        run: python3 tests/conversation-aggregation-smoke.py src/BKE.Dna.Logger.Host/bin/Release/net10.0/BKE.Dna.Logger.Host.dll
      - name: Logical conversation SQLite projection smoke
        run: python3 tests/conversation-sqlite-smoke.py src/BKE.Dna.Logger.Host/bin/Release/net10.0/BKE.Dna.Logger.Host.dll
