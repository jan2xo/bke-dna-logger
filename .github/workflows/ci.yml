name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native host
        run: dotnet build src/BKE.Dna.Logger.Host/BKE.Dna.Logger.Host.csproj --configuration Release
      - name: Smoke version
        run: dotnet run --project src/BKE.Dna.Logger.Host/BKE.Dna.Logger.Host.csproj --configuration Release --no-build -- --version
